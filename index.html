<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>本子抽卡机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1B1B2F;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    user-select: none;
    -webkit-user-select: none;
  }
  .title { font-size: 34px; font-weight: bold; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #B0B0C8; margin-bottom: 48px; }
  .card {
    background: #2A2A45;
    border: 2px solid #5C5C8A;
    border-radius: 24px;
    min-width: 280px;
    padding: 32px 40px;
    text-align: center;
    font-size: 52px;
    font-weight: bold;
    color: #FFD166;
    letter-spacing: 2px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .label { font-size: 16px; color: #B0B0C8; margin-top: 28px; min-height: 24px; }
  .btn {
    margin-top: 56px;
    background: #EF476F;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 32px;
    padding: 14px 56px;
    min-width: 220px;
    cursor: pointer;
    transition: transform .1s, background .1s;
    letter-spacing: 4px;
  }
  .btn:active { background: #D63A60; transform: scale(0.96); }
  .btn:disabled { opacity: 0.7; }
  .pop { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0.5; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="title">本子抽卡机</div>
  <div class="subtitle">点击按钮，随机抽取六 / 七位数字</div>
  <div class="card" id="number">?</div>
  <div class="label" id="label">准备好了吗？</div>
  <button class="btn" id="draw">抽 卡</button>

<script>
  const numberEl = document.getElementById('number');
  const labelEl = document.getElementById('label');
  const btn = document.getElementById('draw');

  function randomNumber(digits) {
    if (!digits) digits = Math.random() < 0.5 ? 6 : 7;
    let s = String(1 + Math.floor(Math.random() * 9));
    for (let i = 1; i < digits; i++) s += Math.floor(Math.random() * 10);
    return s;
  }

  let rolling = false;
  btn.addEventListener('click', () => {
    if (rolling) return;
    rolling = true;
    btn.disabled = true;

    // 滚动效果：快速切换随机数字
    const roll = setInterval(() => {
      numberEl.textContent = randomNumber();
    }, 60);

    // 0.9 秒后定格
    setTimeout(() => {
      clearInterval(roll);
      const digits = Math.random() < 0.5 ? 6 : 7;
      const num = randomNumber(digits);
      numberEl.textContent = num;
      labelEl.textContent = '抽中了 ' + digits + ' 位数字';
      numberEl.classList.remove('pop');
      void numberEl.offsetWidth; // 重新触发动画
      numberEl.classList.add('pop');
      rolling = false;
      btn.disabled = false;
    }, 900);
  });
</script>
</body>
</html>
